# Maison Deco — un seul domaine pour la boutique et l'API.
#
#   https://maisondeco.ma/          -> /var/www/maisondeco (export statique Next)
#   https://maisondeco.ma/api/...   -> 127.0.0.1:4400 (Express, via PM2)
#   https://maisondeco.ma/uploads/  -> 127.0.0.1:4400 (photos envoyees depuis /admin)
#
# Installation :
#   sudo cp deploy/nginx-maisondeco.conf /etc/nginx/sites-available/maisondeco
#   sudo ln -sf /etc/nginx/sites-available/maisondeco /etc/nginx/sites-enabled/maisondeco
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ce fichier ne contient QUE le port 80 : `certbot --nginx` ajoute lui-meme le
# bloc 443 et la redirection vers HTTPS. Ecrire les chemins de certificats avant
# qu'ils existent empecherait nginx de demarrer.

# Le www renvoie sur le domaine nu : une seule adresse indexee, un seul canonique.
# La cible est en https meme si ce bloc ecoute en 80 : sans cela, une visite sur
# http://www fait trois sauts (https://www, puis http://, puis https://), dont un
# en clair. certbot insere son bloc de validation avant cette redirection, donc
# la delivrance du certificat n'en souffre pas.
server {
    listen 80;
    listen [::]:80;
    server_name www.maisondeco.ma;
    return 301 https://maisondeco.ma$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name maisondeco.ma;

    root /var/www/maisondeco;
    index index.html;

    # 12 Mo acceptes par multer cote API, plus la marge du multipart.
    client_max_body_size 15m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               image/svg+xml application/rss+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API -----------------------------------------------------------------
    # Le site etant servi depuis la meme origine, le navigateur n'a plus de
    # preflight a passer pour les GET. ALLOWED_ORIGINS reste indispensable :
    # les POST (commandes, messages) envoient un en-tete Origin.
    location /api/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Sonde de sante de l'API, pratique depuis un navigateur ou un moniteur.
    location = /health {
        proxy_pass http://127.0.0.1:4400/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Photos produit. Le nom de fichier porte un horodatage : une photo changee
    # est une nouvelle URL, jamais une version perimee.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Site statique -------------------------------------------------------
    # Fichiers versionnes par Next : le nom change a chaque build, on peut donc
    # les garder un an.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(webp|avif|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Le HTML n'est jamais mis en cache par le navigateur : un `npm run build`
    # doit etre visible au rechargement suivant, sans vidage de cache.
    location / {
        # trailingSlash: true cote Next -> /produits/ sert /produits/index.html
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
        # add_header n'est herite du bloc parent que si l'enfant n'en declare
        # aucun : les en-tetes de securite sont donc repetes ici, la ou le HTML
        # est reellement servi.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;
}
