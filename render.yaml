# Deploiement de l'API sur Render (Blueprint).
#
# Render lit ce fichier a la racine du depot. Le site (frontend/) n'est PAS
# deploye ici : c'est un export statique qui part sur l'hebergement mutualise.
#
# Les valeurs marquees `sync: false` ne sont pas dans le depot : Render les
# demande au premier deploiement et les garde chiffrees. Ne jamais ecrire une
# cle ou un mot de passe dans ce fichier, il est public.
services:
  - type: web
    name: atelier-omar-api
    runtime: node
    plan: free
    # Francfort : le plus proche du Maroc parmi les regions Render.
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Render interroge cette route pour savoir si le service est vivant. Elle ne
    # touche pas la base, donc une base injoignable ne fait pas redemarrer en boucle.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Base de donnees. Obligatoire : sans elle l'API retombe sur un fichier
      # local que Render efface a chaque deploiement.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: atelier_omar

      # Signature des jetons d'administration. 32 caracteres aleatoires ou plus ;
      # Render peut la generer lui-meme.
      - key: AUTH_SECRET
        generateValue: true

      # Compte administrateur cree par `npm run seed` (a lancer une seule fois
      # depuis le Shell Render si la base est vide).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Sites autorises a appeler l'API, separes par des virgules. Le domaine de
      # la boutique DOIT y figurer, sinon le navigateur bloque commandes et
      # messages sans message d'erreur lisible.
      - key: ALLOWED_ORIGINS
        sync: false

      # URL publique de l'API elle-meme (adresse .onrender.com ou domaine propre).
      - key: PUBLIC_URL
        sync: false

      # Photos produit. Sans Cloudinary, les fichiers envoyes depuis /admin
      # disparaissent au deploiement suivant : le disque de Render est ephemere.
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_FOLDER
        value: atelier-omar/produits
